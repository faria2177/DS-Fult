name: Launch check (emulator)

on:
  workflow_dispatch:
  push:
    branches: [launch-check]

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [main, 'v0.5.53+67']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/checkout@v4
        with:
          path: checker
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Generate Android host project
        run: bash tool/setup_android.sh
      - name: Bundle offline Bengali OCR model
        run: bash tool/download_ocr_models.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Repair legacy Tesseract Android build script
        run: bash tool/patch_tesseract_gradle.sh
      - name: Build x86_64 release APK
        run: flutter build apk --release --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: build/app/outputs/flutter-apk/app-release.apk
          TAG: ${{ matrix.ref }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash checker/tools/launch_check.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-logs-${{ strategy.job-index }}
          path: launch-logs

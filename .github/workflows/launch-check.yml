name: Launch check (emulator)

on:
  workflow_dispatch:
  push:
    branches: [launch-check]

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Recent versions on pub.dev
        run: |
          for p in jni jni_flutter path_provider_android path_provider; do
            echo "== $p"
            curl -s "https://pub.dev/api/packages/$p" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for v in d['versions'][-5:]:
              deps=v['pubspec'].get('dependencies',{})
              print(v['version'], v.get('published'), {k:deps[k] for k in deps if 'jni' in k})
          "
          done

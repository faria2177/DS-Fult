name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push to a branch needs a full Android build.
concurrency:
  group: docscanner-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    # Write access is only used by the release step, which runs on main.
    permissions:
      contents: write
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Generate Android host project
        run: bash tool/setup_android.sh
      - name: Bundle offline Bengali OCR model
        run: bash tool/download_ocr_models.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Repair legacy Tesseract Android build script
        run: bash tool/patch_tesseract_gradle.sh
      - name: Verify independent C++ boundary engine
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            third_party/doclens/android/src/main/cpp/ds_page_scanner.cpp \
            third_party/doclens/android/src/test/cpp/ds_page_scanner_test.cpp \
            -o /tmp/ds_native_scanner_test
          /tmp/ds_native_scanner_test
      - name: Verify standalone C++ image enhancement (sanitizers)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tools/test_native_image_enhancer.cpp \
            third_party/doclens/android/src/main/cpp/ds_image_enhancer.cpp \
            -o /tmp/ds_native_enhance_test
          /tmp/ds_native_enhance_test
      - name: Compile and verify native JNI enhancement entry point
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            third_party/doclens/android/src/main/cpp/ds_image_enhancer.cpp \
            third_party/doclens/android/src/main/cpp/ds_image_enhancer_jni.cpp \
            -o /tmp/libds_enhancer_jni_host.so
          nm -D /tmp/libds_enhancer_jni_host.so | grep -F \
            'Java_dev_doclens_doclens_NativeImageEnhancer_enhanceArgbNative'
      - name: Verify scanner core libds_scannercore (sanitizers + JNI symbols)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wconversion -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            third_party/doclens/android/src/main/cpp/ds_scanner_core.cpp \
            third_party/doclens/android/src/test/cpp/ds_scanner_core_test.cpp \
            -o /tmp/ds_scanner_core_test
          /tmp/ds_scanner_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            third_party/doclens/android/src/main/cpp/ds_scanner_core.cpp \
            third_party/doclens/android/src/main/cpp/ds_scanner_core_jni.cpp \
            -o /tmp/libds_scannercore_host.so
          nm -D /tmp/libds_scannercore_host.so | grep -F 'NativeScannerCore_magicEnhanceNative'
          nm -D /tmp/libds_scannercore_host.so | grep -F 'NativeScannerCore_paperRegionNative'
      - name: Verify PDF codec libds_pdfcodec (sanitizers + JNI symbol)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wconversion -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            third_party/doclens/android/src/main/cpp/ds_pdf_codec.cpp \
            third_party/doclens/android/src/test/cpp/ds_pdf_codec_test.cpp \
            -o /tmp/ds_pdf_codec_test
          /tmp/ds_pdf_codec_test
          g++ -std=c++17 -O2 -Wall -Wextra -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            third_party/doclens/android/src/main/cpp/ds_pdf_codec.cpp \
            third_party/doclens/android/src/main/cpp/ds_pdf_codec_jni.cpp \
            -o /tmp/libds_pdfcodec_host.so
          nm -D /tmp/libds_pdfcodec_host.so | grep -F 'NativePdfCodec_bilevelG4Native'
      - name: Verify native four-corner detector and JNI plugin
        run: cd android && ./gradlew :doclens:testDebugUnitTest --no-daemon
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Prepare release signing key
        env:
          DS_KEYSTORE_BASE64: ${{ secrets.DS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DS_KEYSTORE_BASE64" ]; then
            echo "$DS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ds-release.jks"
            echo "DS_KEYSTORE_PATH=$RUNNER_TEMP/ds-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore installed."
          else
            echo "::warning::DS_KEYSTORE_BASE64 secret is not set. This APK is signed with a throwaway debug key and cannot update an installed copy."
          fi
      - name: Build release APKs
        env:
          DS_KEYSTORE_PASSWORD: ${{ secrets.DS_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify DocScanner native libraries are packaged
        run: |
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E 'lib/arm64-v8a/libds_' | tee /tmp/own_libs.txt
          grep -q 'libds_scannercore.so' /tmp/own_libs.txt
          grep -q 'libds_pagescanner.so' /tmp/own_libs.txt
          grep -q 'libds_docnet.so' /tmp/own_libs.txt
          grep -q 'libds_pdfcodec.so' /tmp/own_libs.txt
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E 'assets/docnet/docnet.(param|bin)'
      - name: Show APK signing certificate
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -i 'SHA-256'
      - name: Verify ARM64 APK native packaging
        run: python3 tools/verify_arm64_apk.py
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-Android-APKs
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      # The arm64 APK cannot run on the hosted x86_64 emulator, so the same
      # code is built once more for x86_64 and actually opened. A release is
      # only published when the app starts without errors.
      - name: Build x86_64 APK for the launch check
        run: flutter build apk --release --target-platform android-x64
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch check on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/launch_smoke_test.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload launch check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-check-logs
          path: launch-logs
          if-no-files-found: ignore
      # In-app updates read GitHub Releases. Each new `version:` in
      # pubspec.yaml that reaches main is published once, with
      # RELEASE_NOTES.md as the "What's New" text. Only APKs signed with the
      # fixed release key are published, because Android refuses to update
      # an app from an APK signed with a different key.
      - name: Publish GitHub release for in-app updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${DS_KEYSTORE_PATH:-}" ]; then
            echo "::warning::No release published: add the DS_KEYSTORE_BASE64 and DS_KEYSTORE_PASSWORD secrets first."
            exit 0
          fi
          version="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump version in pubspec.yaml to publish a new one."
            exit 0
          fi
          name="${version%%+*}"
          apk="DocScanner-v${name}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"
          notes=RELEASE_NOTES.md
          [ -s "$notes" ] || { echo "DocScanner v${name}" > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
            --title "DocScanner v${name}" --notes-file "$notes"

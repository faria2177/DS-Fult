name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push to a branch needs a full Android build.
concurrency:
  group: docscanner-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Generate Android host project
        run: bash tool/setup_android.sh
      - name: Bundle offline Bengali OCR model
        run: bash tool/download_ocr_models.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Repair legacy Tesseract Android build script
        run: bash tool/patch_tesseract_gradle.sh
      - name: Verify independent C++ boundary engine
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            third_party/doclens/android/src/main/cpp/ds_page_scanner.cpp \
            third_party/doclens/android/src/test/cpp/ds_page_scanner_test.cpp \
            -o /tmp/ds_native_scanner_test
          /tmp/ds_native_scanner_test
      - name: Verify standalone C++ image enhancement (sanitizers)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tools/test_native_image_enhancer.cpp \
            third_party/doclens/android/src/main/cpp/ds_image_enhancer.cpp \
            -o /tmp/ds_native_enhance_test
          /tmp/ds_native_enhance_test
      - name: Compile and verify native JNI enhancement entry point
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            third_party/doclens/android/src/main/cpp/ds_image_enhancer.cpp \
            third_party/doclens/android/src/main/cpp/ds_image_enhancer_jni.cpp \
            -o /tmp/libds_enhancer_jni_host.so
          nm -D /tmp/libds_enhancer_jni_host.so | grep -F \
            'Java_dev_doclens_doclens_NativeImageEnhancer_enhanceArgbNative'
      - name: Verify native four-corner detector and JNI plugin
        run: cd android && ./gradlew :doclens:testDebugUnitTest --no-daemon
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Prepare release signing key
        env:
          DS_KEYSTORE_BASE64: ${{ secrets.DS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DS_KEYSTORE_BASE64" ]; then
            echo "$DS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ds-release.jks"
            echo "DS_KEYSTORE_PATH=$RUNNER_TEMP/ds-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore installed."
          else
            echo "::warning::DS_KEYSTORE_BASE64 secret is not set. This APK is signed with a throwaway debug key and cannot update an installed copy."
          fi
      - name: Build release APKs
        env:
          DS_KEYSTORE_PASSWORD: ${{ secrets.DS_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Show APK signing certificate
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -i 'SHA-256'
      - name: Verify ARM64 APK native packaging
        run: python3 tools/verify_arm64_apk.py
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-Android-APKs
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

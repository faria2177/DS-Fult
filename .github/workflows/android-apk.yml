name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Generate Android host project
        run: bash tool/setup_android.sh
      - name: Bundle offline Bengali OCR model
        run: bash tool/download_ocr_models.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Repair legacy Tesseract Android build script
        run: bash tool/patch_tesseract_gradle.sh
      - name: Verify independent C++ boundary engine
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            third_party/doclens/android/src/main/cpp/ds_page_scanner.cpp \
            third_party/doclens/android/src/test/cpp/ds_page_scanner_test.cpp \
            -o /tmp/ds_native_scanner_test
          /tmp/ds_native_scanner_test
      - name: Verify native four-corner detector
        run: cd android && ./gradlew :doclens:testDebugUnitTest --no-daemon
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-Android-APKs
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

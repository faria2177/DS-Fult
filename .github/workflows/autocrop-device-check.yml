name: Auto crop device check

# Runs the real gallery auto-crop on an Android emulator against synthetic
# photos (tool/make_autocrop_fixtures.py). Manual, or on pushes that touch
# the detection code.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'lib/src/services/document_edges.dart'
      - 'lib/src/services/salient_document_detector.dart'
      - 'lib/src/services/background_contrast_contour.dart'
      - 'lib/src/services/offline_document_contour.dart'
      - 'lib/src/services/quad_edge_evidence.dart'
      - 'third_party/doclens/android/**'
      - 'integration_test/**'
      - 'tool/make_autocrop_fixtures.py'
      - '.github/workflows/autocrop-device-check.yml'

jobs:
  autocrop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Generate synthetic photos
        run: |
          pip install --quiet opencv-python-headless numpy
          python3 tool/make_autocrop_fixtures.py
      - name: Prepare Android project
        run: |
          bash tool/setup_android.sh
          bash tool/download_ocr_models.sh
          flutter pub get
          bash tool/patch_tesseract_gradle.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run auto crop on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter test integration_test/auto_crop_device_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee autocrop.log; grep -E "AUTOCROP|DocumentEdges" autocrop.log | head -80; grep -q "All tests passed" autocrop.log
